<!DOCTYPE html>
<html lang="es" data-tema="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convierte enlaces de YouTube a MP3 gratis, en tu propio equipo y sin instalar nada.">
    <title>TubeToMP3 — Convertir YouTube a MP3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v=3) }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>">
    <script>
        // Aplica el tema guardado antes de pintar para evitar parpadeo (dark por defecto)
        (function () {
            var tema = localStorage.getItem("tubetomp3-tema");
            if (tema === "light") {
                document.documentElement.setAttribute("data-tema", "light");
            }
        })();
    </script>
</head>
<body>
<main class="card">
    <header class="cabecera">
        <button id="tema-toggle" class="tema-toggle" type="button" aria-label="Cambiar tema" title="Tema claro / oscuro">
            <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <h1>TubeToMP3</h1>
        <p class="subtitulo">Convierte enlaces de YouTube a MP3, gratis y en tu propio equipo</p>
    </header>

    <form id="formulario" novalidate>
        <label class="etiqueta" for="youtube_url">Enlace de YouTube</label>
        <div class="campo">
            <span class="campo-icono" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </span>
            <input type="url" id="youtube_url" name="youtube_url"
                   placeholder="Pega aquí el enlace de YouTube…"
                   autocomplete="off" spellcheck="false" required>
        </div>
        <button type="submit" id="boton-convertir">
            <span class="boton-texto">Convertir a MP3</span>
        </button>
    </form>

    <section id="area-progreso" class="oculto" aria-live="polite">
        <div class="progreso-cabecera">
            <span id="mensaje">Preparando…</span>
            <span id="porcentaje">0%</span>
        </div>
        <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barra-contenedor">
            <div class="barra-llenado" id="barra-llenado"></div>
        </div>
        <p id="detalle" class="detalle"></p>
    </section>

    <section id="area-resultado" class="oculto" aria-live="polite">
        <p class="resultado-exito">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            ¡Audio listo!
        </p>
        <a id="boton-descarga" class="boton-descarga" download>Descargar audio</a>
        <p id="detalle-resultado" class="detalle"></p>
    </section>

    <p id="mensaje-error" class="mensaje-error oculto" role="alert"></p>
</main>

<script src="{{ url_for('static', filename='js/script.js', v=3) }}"></script>
</body>
</html>
