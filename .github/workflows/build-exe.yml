name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Compilar ejecutable (Opción 1: yt-dlp incrustado, ffmpeg autodescarga)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TubeToMP3 `
            --collect-all yt_dlp `
            --add-data "templates;templates" `
            --add-data "static;static" `
            app.py

      - name: Subir artefacto (pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TubeToMP3-windows-exe
          path: dist/TubeToMP3.exe
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TubeToMP3.exe